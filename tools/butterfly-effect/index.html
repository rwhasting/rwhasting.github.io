<body>
  <a href="/" class="homeLink">← Home</a>
  <div class="pageTitle">The Butterfly Effect</div>
  <canvas id="c"></canvas>
  <div class="hint">
    No butterflies were harmed in the making of this page.<br/>
    The caterpillar, however, had a lot going on.
  </div>

  <script>
  (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    let W, H;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", () => { resize(); initPositions(); });

    const INK_LIGHT = "rgba(58,46,30,0.3)";
    const WING_FILL = "rgba(58,46,30,0.04)";
    const WING_VEIN = "rgba(58,46,30,0.15)";

    function setInk(lw = 1.2, alpha = 1) {
      ctx.strokeStyle = `rgba(58,46,30,${alpha})`;
      ctx.lineWidth = lw;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
    }

    // ══════════════════════════════════════════
    //  BUTTERFLY
    // ══════════════════════════════════════════
    function drawButterfly(x, y, wingBeat, scale = 1, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      const wb = Math.sin(wingBeat);
      const openness = 0.55 + wb * 0.45;

      for (let side of [-1, 1]) {
        ctx.save();
        ctx.scale(side, 1);

        const fw = 52 * openness, fh = 38;
        const hw = 38 * openness, hh = 30;

        // ══ HINDWING (drawn first, sits behind forewing) ══

        // Shape
        ctx.beginPath();
        ctx.moveTo(0, fh*0.15);
        ctx.bezierCurveTo(hw*0.3, fh*0.2, hw, fh*0.1, hw, hh*0.6);
        ctx.bezierCurveTo(hw, hh, hw*0.3, hh*1.1, 0, hh*0.7);
        ctx.closePath();
        ctx.fillStyle = "#f3efe6"; ctx.fill();
        setInk(1.0, alpha); ctx.stroke();

        // Dark border band — filled region just inside the hindwing margin
        ctx.save();
        ctx.clip(); // clip to hindwing shape
        ctx.beginPath();
        ctx.moveTo(0, fh*0.15);
        ctx.bezierCurveTo(hw*0.3, fh*0.2, hw, fh*0.1, hw, hh*0.6);
        ctx.bezierCurveTo(hw, hh, hw*0.3, hh*1.1, 0, hh*0.7);
        ctx.closePath();
        // Inset version — slightly smaller, creates the border band effect via stroke
        ctx.strokeStyle = `rgba(58,46,30,${0.13*alpha})`;
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.restore();

        // Hindwing veins — 3 main radiating veins
        ctx.strokeStyle = `rgba(58,46,30,${0.22*alpha})`; ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(0, fh*0.18);
        ctx.bezierCurveTo(hw*0.22, fh*0.22, hw*0.68, hh*0.42, hw*0.88, hh*0.52);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, fh*0.28);
        ctx.bezierCurveTo(hw*0.2, hh*0.52, hw*0.48, hh*0.82, hw*0.52, hh*0.98);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hw*0.12, fh*0.20);
        ctx.bezierCurveTo(hw*0.32, hh*0.38, hw*0.62, hh*0.52, hw*0.96, hh*0.56);
        ctx.stroke();
        // Cross-veins between hindwing veins
        ctx.strokeStyle = `rgba(58,46,30,${0.13*alpha})`; ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(hw*0.38, hh*0.35); ctx.lineTo(hw*0.40, hh*0.55); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(hw*0.60, hh*0.46); ctx.lineTo(hw*0.58, hh*0.66); ctx.stroke();

        // Hindwing discal cell — the enclosed region near the base
        ctx.beginPath();
        ctx.moveTo(hw*0.12, fh*0.20);
        ctx.bezierCurveTo(hw*0.22, hh*0.32, hw*0.28, hh*0.38, hw*0.30, hh*0.44);
        ctx.bezierCurveTo(hw*0.22, hh*0.46, hw*0.12, hh*0.40, hw*0.08, fh*0.30);
        ctx.closePath();
        ctx.fillStyle = `rgba(58,46,30,${0.06*alpha})`; ctx.fill();
        ctx.strokeStyle = `rgba(58,46,30,${0.18*alpha})`; ctx.lineWidth = 0.6; ctx.stroke();

        // Submarginal spots on hindwing — row of small ovals inside border
        ctx.fillStyle = `rgba(58,46,30,${0.16*alpha})`;
        const hwSpots = [
          { x: hw*0.68, y: hh*0.30 },
          { x: hw*0.80, y: hh*0.44 },
          { x: hw*0.84, y: hh*0.60 },
          { x: hw*0.72, y: hh*0.74 },
        ];
        for (const s of hwSpots) {
          ctx.beginPath();
          ctx.ellipse(s.x, s.y, 2.5, 2.0, 0, 0, Math.PI*2);
          ctx.fill();
        }

        // Tail curl
        setInk(1.0, alpha); ctx.lineWidth = 1.0;
        ctx.beginPath();
        ctx.moveTo(hw*0.6, hh*0.85);
        ctx.bezierCurveTo(hw*0.75, hh*1.0, hw*0.55, hh*1.15, hw*0.4, hh*1.0);
        ctx.stroke();

        // ══ FOREWING (drawn on top of hindwing) ══

        // Shape
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(fw*0.3, -fh*0.5, fw, -fh*0.8, fw, -fh*0.2);
        ctx.bezierCurveTo(fw, fh*0.3, fw*0.4, fh*0.5, 0, fh*0.3);
        ctx.closePath();
        ctx.fillStyle = "#f3efe6"; ctx.fill();
        setInk(1.1, alpha); ctx.stroke();

        // Dark border band on forewing margin
        ctx.save();
        ctx.clip();
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(fw*0.3, -fh*0.5, fw, -fh*0.8, fw, -fh*0.2);
        ctx.bezierCurveTo(fw, fh*0.3, fw*0.4, fh*0.5, 0, fh*0.3);
        ctx.closePath();
        ctx.strokeStyle = `rgba(58,46,30,${0.12*alpha})`;
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.restore();

        // Main forewing veins — 4 radiating from base
        ctx.strokeStyle = `rgba(58,46,30,${0.24*alpha})`; ctx.lineWidth = 0.75;
        // Costal vein (top)
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.bezierCurveTo(fw*0.18, -fh*0.12, fw*0.55, -fh*0.42, fw*0.86, -fh*0.20);
        ctx.stroke();
        // Upper-mid vein
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(fw*0.16, -fh*0.04, fw*0.52, -fh*0.14, fw*0.84, fh*0.06);
        ctx.stroke();
        // Mid vein
        ctx.beginPath();
        ctx.moveTo(0, fh*0.08);
        ctx.bezierCurveTo(fw*0.14, fh*0.16, fw*0.48, fh*0.28, fw*0.76, fh*0.28);
        ctx.stroke();
        // Lower vein
        ctx.beginPath();
        ctx.moveTo(0, fh*0.18);
        ctx.bezierCurveTo(fw*0.10, fh*0.28, fw*0.34, fh*0.42, fw*0.54, fh*0.44);
        ctx.stroke();

        // Cross-veins (short connectors between main veins — window pane effect)
        ctx.strokeStyle = `rgba(58,46,30,${0.14*alpha})`; ctx.lineWidth = 0.5;
        // Inner cross-vein (forms the discal cell end)
        ctx.beginPath();
        ctx.moveTo(fw*0.30, -fh*0.26);
        ctx.bezierCurveTo(fw*0.33, fh*0.00, fw*0.34, fh*0.20, fw*0.30, fh*0.35);
        ctx.stroke();
        // Outer cross-vein
        ctx.beginPath();
        ctx.moveTo(fw*0.58, -fh*0.18);
        ctx.lineTo(fw*0.56, fh*0.10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(fw*0.72, -fh*0.08);
        ctx.lineTo(fw*0.70, fh*0.18);
        ctx.stroke();

        // Discal cell — shaded oval in the middle of the forewing
        ctx.beginPath();
        ctx.moveTo(fw*0.06, -fh*0.04);
        ctx.bezierCurveTo(fw*0.14, -fh*0.12, fw*0.28, -fh*0.16, fw*0.30, -fh*0.04);
        ctx.bezierCurveTo(fw*0.32, fh*0.08, fw*0.24, fh*0.22, fw*0.10, fh*0.18);
        ctx.closePath();
        ctx.fillStyle = `rgba(58,46,30,${0.07*alpha})`; ctx.fill();
        ctx.strokeStyle = `rgba(58,46,30,${0.16*alpha})`; ctx.lineWidth = 0.6; ctx.stroke();

        // Submarginal spot band — row of small ovals just inside the outer margin
        ctx.fillStyle = `rgba(58,46,30,${0.15*alpha})`;
        const fwSpots = [
          { x: fw*0.70, y: -fh*0.50 },
          { x: fw*0.80, y: -fh*0.32 },
          { x: fw*0.86, y: -fh*0.10 },
          { x: fw*0.84, y:  fh*0.12 },
          { x: fw*0.74, y:  fh*0.30 },
        ];
        for (const s of fwSpots) {
          ctx.beginPath();
          ctx.ellipse(s.x, s.y, 2.8, 2.0,
            Math.atan2(s.y + fh*0.1, s.x - fw*0.5) + Math.PI*0.5,
            0, Math.PI*2);
          ctx.fill();
        }

        // Apical patch — cluster of tiny spots near the wing tip
        ctx.fillStyle = `rgba(58,46,30,${0.12*alpha})`;
        for (const [dx, dy] of [[0,0],[5,-4],[9,-2],[7,4]]) {
          ctx.beginPath();
          ctx.arc(fw*0.82 + dx, -fh*0.52 + dy, 1.4, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.restore();
      }

      // Body
      setInk(1.3, alpha);
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.bezierCurveTo(3, -10, 3, 10, 1.5, 32);
      ctx.bezierCurveTo(-1.5, 32, -3, 10, -3, -10);
      ctx.closePath();
      ctx.fillStyle = "#f3efe6"; ctx.fill(); ctx.stroke();

      // Head
      ctx.beginPath();
      ctx.arc(0, -25, 5, 0, Math.PI*2);
      ctx.fillStyle = "#f3efe6"; ctx.fill();
      setInk(1.1, alpha); ctx.stroke();

      // Antennae
      setInk(0.9, alpha);
      for (let side of [-1,1]) {
        ctx.beginPath();
        ctx.moveTo(side*2, -27);
        ctx.bezierCurveTo(side*4, -35, side*12, -42, side*14, -46);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(side*14, -47, 2, 0, Math.PI*2);
        ctx.fillStyle = INK_LIGHT; ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  FLOWER (butterfly resting spot)
    // ══════════════════════════════════════════
    function drawFlower(x, groundY, alpha = 1) {
      if (alpha <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;

      setInk(1.0);
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.bezierCurveTo(x-3, groundY-25, x+4, groundY-45, x, groundY-60);
      ctx.stroke();

      for (let side of [-1,1]) {
        ctx.beginPath();
        ctx.moveTo(x+side*2, groundY-30);
        ctx.bezierCurveTo(x+side*16, groundY-28, x+side*20, groundY-38, x+side*14, groundY-42);
        ctx.bezierCurveTo(x+side*8, groundY-38, x+side*4, groundY-32, x+side*2, groundY-30);
        ctx.fillStyle = "rgba(58,46,30,0.05)"; ctx.fill();
        setInk(0.9); ctx.stroke();
      }

      const fx = x, fy = groundY-68;
      for (let i = 0; i < 6; i++) {
        const angle = (i/6)*Math.PI*2;
        const px = fx+Math.cos(angle)*10, py = fy+Math.sin(angle)*10;
        ctx.beginPath();
        ctx.ellipse(px, py, 5, 7, angle, 0, Math.PI*2);
        ctx.fillStyle = "rgba(58,46,30,0.05)"; ctx.fill();
        setInk(0.9); ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(fx, fy, 6, 0, Math.PI*2);
      ctx.fillStyle = "rgba(58,46,30,0.12)"; ctx.fill();
      setInk(1.1); ctx.stroke();

      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  CATERPILLAR
    // ══════════════════════════════════════════
    function drawCaterpillar(x, y, walkPhase, scaleX = 1, alpha = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scaleX, 1);
      ctx.globalAlpha = alpha;
      setInk(1.2, alpha);

      const segs = 7, segR = 9, segSpacing = 14;
      for (let i = segs-1; i >= 0; i--) {
        const bx = -i*segSpacing;
        const wave = Math.sin(walkPhase + i*0.7)*2;
        ctx.beginPath();
        ctx.arc(bx, wave, segR, 0, Math.PI*2);
        ctx.fillStyle = "#f3efe6"; ctx.fill(); ctx.stroke();

        if (i > 0) {
          // All segments have swinging legs
          const swing = Math.sin(walkPhase + i*1.2)*5;
          for (let side of [-1,1]) {
            ctx.beginPath();
            ctx.moveTo(bx+side*3, wave+segR);
            ctx.lineTo(bx+side*(9+swing), wave+segR+8);
            ctx.stroke();
          }
        }
      }

      // Head
      const hw = Math.sin(walkPhase)*2;
      ctx.beginPath();
      ctx.arc(0, hw, segR+1, 0, Math.PI*2);
      ctx.fillStyle = "#f3efe6"; ctx.fill();
      setInk(1.3, alpha); ctx.stroke();

      ctx.beginPath(); ctx.arc(5, hw-3, 2, 0, Math.PI*2);
      ctx.fillStyle = `rgba(58,46,30,${alpha})`; ctx.fill();

      setInk(0.8, alpha);
      for (let side of [-1,1]) {
        ctx.beginPath();
        ctx.moveTo(side*3, hw-segR);
        ctx.bezierCurveTo(side*6, hw-segR-8, side*10, hw-segR-12, side*8, hw-segR-16);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  CLIMBING CATERPILLAR
    //  Each segment follows the one in front along the stem.
    //  turnProgress 0=horizontal, 1=fully vertical (head leads).
    //  climbed = how many px up the stem the head is.
    // ══════════════════════════════════════════
    function drawClimbingCaterpillar(headX, headY, walkPhase, turnProgress, climbed, alpha = 1) {
      const segs = 7, segR = 9, segSpacing = 14;
      // The floor: segments on the ground sit at this Y
      const floorY = groundY - segR;
      // The stem X: once vertical, all segments hug this x
      const stemX = headX;

      // Build positions from head (i=0) to tail (i=segs-1).
      // For each segment we know:
      //   - its ideal Y = headY + i*segSpacing  (if fully vertical on stem)
      //   - but if that Y > floorY, it's still on the ground at floorY
      // Then X: if on ground → step left by segSpacing from previous X
      //         if on stem   → stemX (hug the stem)
      //         transition   → interpolate
      const pts = [];
      for (let i = 0; i < segs; i++) {
        if (i === 0) {
          pts.push({ x: headX, y: headY });
          continue;
        }
        const prev = pts[i - 1];

        // Where would this segment be if fully vertical?
        const vertY = headY + i * segSpacing;
        // Where would it be if fully horizontal (on ground, stepping left)?
        const horizY = floorY;

        if (vertY >= floorY) {
          // This segment belongs on the ground
          // Step left from previous, constrained to segSpacing distance
          const dy = floorY - prev.y;  // prev may be above floor during transition
          const dx = -Math.sqrt(Math.max(0, segSpacing * segSpacing - dy * dy));
          pts.push({ x: prev.x + dx, y: floorY });
        } else {
          // This segment is on the stem — smoothly interpolate x toward stemX
          // based on how far above the ground it is
          const aboveGround = floorY - vertY;
          const blendDist = segs * segSpacing; // full blend over one body-length
          const blend = Math.min(1, aboveGround / blendDist);
          const groundX = prev.x - segSpacing; // where it would be if horizontal
          const sx = stemX + (groundX - stemX) * (1 - blend);
          pts.push({ x: sx, y: vertY });
        }
      }

      ctx.save();
      ctx.globalAlpha = alpha;
      setInk(1.2);

      // Draw tail-first so head is on top
      for (let i = segs - 1; i >= 0; i--) {
        const { x: bx, y: by } = pts[i];
        const onGround = by >= floorY - 1;
        // Wave only while on ground
        const wave = onGround ? Math.sin(walkPhase + i * 0.7) * 2 : 0;

        ctx.beginPath();
        ctx.arc(bx, by + wave, segR, 0, Math.PI * 2);
        ctx.fillStyle = "#f3efe6"; ctx.fill(); ctx.stroke();

        // Legs — on ground: hang downward; on stem: stick sideways
        if (i > 0 && i <= 5) {
          const swing = Math.sin(walkPhase + i * 1.2) * (onGround ? 4 : 2);
          for (let side of [-1, 1]) {
            if (onGround) {
              // Normal downward legs
              ctx.beginPath();
              ctx.moveTo(bx + side * 3, by + wave + segR);
              ctx.lineTo(bx + side * (8 + swing), by + wave + segR + 7);
              ctx.stroke();
            } else {
              // On stem: right-side legs (+1) reach toward stem and grip downward
              // Left-side legs (-1) are shorter and tucked
              const reach = side === 1 ? (segR + 8 + swing) : (segR + 3);
              const droop = side === 1 ? 5 : 2;
              ctx.beginPath();
              ctx.moveTo(bx + side * segR, by);
              ctx.lineTo(bx + side * reach, by + droop);
              ctx.stroke();
            }
          }
        }
      }

      // Head
      const { x: hx, y: hy } = pts[0];
      ctx.beginPath();
      ctx.arc(hx, hy, segR + 1, 0, Math.PI * 2);
      ctx.fillStyle = "#f3efe6"; ctx.fill();
      setInk(1.3); ctx.stroke();

      // Eye and antennae rotate with turnProgress
      const headAngle = -(Math.PI / 2) * Math.min(1, turnProgress);
      const eyeOffX = Math.cos(headAngle) * 5 + Math.sin(headAngle) * 3;
      const eyeOffY = Math.sin(headAngle) * 5 - Math.cos(headAngle) * 3;
      ctx.beginPath();
      ctx.arc(hx + eyeOffX, hy + eyeOffY, 2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(58,46,30,1)"; ctx.fill();

      setInk(0.8);
      const fwdX = Math.cos(headAngle), fwdY = Math.sin(headAngle);
      const perpHX = Math.sin(headAngle), perpHY = -Math.cos(headAngle);
      for (let side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(hx + perpHX*side*3, hy + perpHY*side*3);
        ctx.bezierCurveTo(
          hx + perpHX*side*6  + fwdX*4,  hy + perpHY*side*6  + fwdY*4,
          hx + perpHX*side*10 + fwdX*6,  hy + perpHY*side*10 + fwdY*6,
          hx + perpHX*side*8  + fwdX*10, hy + perpHY*side*8  + fwdY*10
        );
        ctx.stroke();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  MILKWEED
    // ══════════════════════════════════════════
    function drawMilkweed(x, groundY, leafHealth = 1, climbed = 0) {
      const stemH = Math.min(260, Math.max(160, H * 0.82 * 0.40));
      const climbDist = stemH * 0.885; // caterpillar climbs 88.5% of stem height
      ctx.save();
      setInk(1.3);
      ctx.beginPath();
      ctx.moveTo(x, groundY);
      ctx.bezierCurveTo(x-5, groundY-stemH*0.308, x+8, groundY-stemH*0.615, x, groundY-stemH);
      ctx.stroke();

      // Leaves disappear bottom-up as caterpillar climbs (driven by leafHealth 1→0),
      // and regrow bottom-up during chrysalis (driven by leafHealth 0→1).
      // leafHealth is set in CLIMBING: 1 - (climbed/climbDist), so bottom leaf
      // (at stem fraction 0.25) disappears when leafHealth drops below ~0.75,
      // i.e. its disappear-threshold = 1 - lp.t.
      // Regrow threshold = lp.t so bottom reappears first as leafHealth rises.
      // We take whichever gives the higher alpha (disappear wins while climbing,
      // regrow wins while in chrysalis once health starts rising).
      // climbDist derived from stemH above
      // Each leaf pair: t=position along stem (0=base, 1=top).
      // angleL/angleR = outward spread from horizontal (larger = more upright).
      // droopL/droopR = downward tilt so leaves hang naturally.
      // Varied per pair so they look like a real alternating leaf arrangement.
      const leafPairs = [
        { t: 0.25, angleL: 0.42, angleR: 0.38, droopL: 0.18, droopR: 0.06 },
        { t: 0.50, angleL: 0.30, angleR: 0.46, droopL: 0.05, droopR: 0.24 },
        { t: 0.72, angleL: 0.40, angleR: 0.30, droopL: 0.14, droopR: 0.10 },
      ];
      const fadeRange = 0.18;

      for (const lp of leafPairs) {
        let leafAlpha;
        if (leafGrowing) {
          // Regrowing during chrysalis: bottom leaf reappears first (same as before)
          const threshold = lp.t;
          leafAlpha = Math.max(0, Math.min(1, (leafHealth - threshold) / fadeRange));
        } else {
          // Climbing: only start fading once caterpillar has actually reached this leaf.
          // Leaf is at lp.t * climbDist px up the stem. Fade over the next fadeRange*climbDist px.
          const leafPx = lp.t * climbDist;
          const fadePx = fadeRange * climbDist;
          leafAlpha = Math.max(0, Math.min(1, 1 - (climbed - leafPx) / fadePx));
        }
        if (leafAlpha <= 0) continue;

        // Sample the actual stem bezier at t to get exact attachment point.
        const bt = lp.t;
        const lx = (1-bt)**3*x + 3*(1-bt)**2*bt*(x-5) + 3*(1-bt)*bt**2*(x+8) + bt**3*x;
        const ly = (1-bt)**3*groundY + 3*(1-bt)**2*bt*(groundY-stemH*0.308) + 3*(1-bt)*bt**2*(groundY-stemH*0.615) + bt**3*(groundY-stemH);

        for (const side of [-1, 1]) {
          const angle = side === -1 ? lp.angleL : lp.angleR;
          const droop = side === -1 ? lp.droopL : lp.droopR;
          // Rotate outward from stem: side flips left/right, droop tilts downward
          const rot = -(Math.PI * 0.5 - angle) - droop;
          ctx.save();
          ctx.translate(lx, ly);
          ctx.scale(side, 1);
          ctx.rotate(rot);
          ctx.globalAlpha = leafAlpha;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(18, -8, 42, -5, 52, 4);
          ctx.bezierCurveTo(42, 12, 18, 12, 0, 0);
          ctx.fillStyle = "rgba(58,46,30,0.05)"; ctx.fill();
          setInk(1.0); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(18, 0, 38, 2, 52, 4);
          ctx.strokeStyle = "rgba(58,46,30,0.3)"; ctx.lineWidth = 0.7; ctx.stroke();
          ctx.restore();
        }
      }

      const fx = x, fy = groundY-stemH*1.02;
      for (let i = 0; i < 7; i++) {
        const a = (i/7)*Math.PI*2;
        ctx.beginPath();
        ctx.arc(fx+Math.cos(a)*12, fy+Math.sin(a)*7, 3.5, 0, Math.PI*2);
        ctx.fillStyle = "rgba(58,46,30,0.08)"; ctx.fill();
        setInk(0.9); ctx.stroke();
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  CHRYSALIS
    // ══════════════════════════════════════════
    function drawChrysalis(x, y, formedness, alpha = 1) {
      if (formedness <= 0 || alpha <= 0) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.globalAlpha = alpha;
      const w = 14*formedness, h = 34*formedness;

      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.bezierCurveTo(w,0, w*1.1,h*0.5, w*0.8,h);
      ctx.bezierCurveTo(w*0.3,h*1.1, -w*0.3,h*1.1, -w*0.8,h);
      ctx.bezierCurveTo(-w*1.1,h*0.5, -w,0, 0,0);
      ctx.closePath();
      ctx.fillStyle = "#f3efe6"; ctx.fill();
      setInk(1.3, alpha); ctx.stroke();

      setInk(0.7, alpha*0.5);
      for (let i = 1; i <= 4; i++) {
        const ry = h*(i/5), rw = w*(0.9-i*0.08);
        ctx.beginPath();
        ctx.moveTo(-rw, ry);
        ctx.bezierCurveTo(-rw*0.3, ry-3, rw*0.3, ry-3, rw, ry);
        ctx.stroke();
      }

      setInk(1.0, alpha);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-18); ctx.stroke();

      if (formedness > 0.7) {
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc((i-1)*w*0.4, h*0.18, 1.8, 0, Math.PI*2);
          ctx.fillStyle = `rgba(140,100,20,${0.6*alpha*((formedness-0.7)/0.3)})`;
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  BACKGROUND LANDSCAPE
    //  Drawn first so everything sits on top of it.
    //  Uses a seeded deterministic layout so it's stable every frame.
    // ══════════════════════════════════════════
    function drawGround(groundY) {
      ctx.save();

      // ── Distant rolling hills ──
      setInk(0.6, 0.12);
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.bezierCurveTo(W*0.15, groundY-55, W*0.28, groundY-70, W*0.38, groundY-45);
      ctx.bezierCurveTo(W*0.48, groundY-22, W*0.55, groundY-60, W*0.68, groundY-75);
      ctx.bezierCurveTo(W*0.80, groundY-88, W*0.90, groundY-50, W, groundY-35);
      ctx.lineTo(W, groundY);
      ctx.closePath();
      ctx.fillStyle = "rgba(58,46,30,0.045)";
      ctx.fill();
      ctx.stroke();

      // ── Ground line ──
      setInk(0.8, 0.3);
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(W, groundY);
      ctx.stroke();

      // ── Rocks ──
      const rocks = [
        { fx: 0.08, w: 18, h: 10 },
        { fx: 0.19, w: 11, h:  7 },
        { fx: 0.38, w: 22, h: 12 },
        { fx: 0.51, w:  9, h:  6 },
        { fx: 0.63, w: 16, h:  9 },
        { fx: 0.84, w: 20, h: 11 },
        { fx: 0.93, w: 12, h:  7 },
      ];
      for (const r of rocks) {
        const rx = r.fx * W, ry = groundY;
        ctx.beginPath();
        ctx.ellipse(rx, ry - r.h*0.45, r.w*0.5, r.h*0.55, 0, Math.PI, 0);
        ctx.fillStyle = "rgba(58,46,30,0.05)";
        ctx.fill();
        setInk(0.8, 0.2);
        ctx.stroke();
      }

      // ── Distant small shrubs ──
      const shrubs = [
        { fx: 0.10, h: 28, spread: 22 },
        { fx: 0.45, h: 20, spread: 16 },
        { fx: 0.60, h: 32, spread: 26 },
        { fx: 0.88, h: 24, spread: 18 },
      ];
      for (const s of shrubs) {
        const sx = s.fx * W;
        // Stem
        setInk(0.7, 0.18);
        ctx.beginPath();
        ctx.moveTo(sx, groundY);
        ctx.lineTo(sx, groundY - s.h * 0.5);
        ctx.stroke();
        // Canopy — a few wispy arcs
        for (let b = -1; b <= 1; b++) {
          ctx.beginPath();
          ctx.moveTo(sx, groundY - s.h * 0.45);
          ctx.bezierCurveTo(
            sx + b * s.spread * 0.4, groundY - s.h * 0.7,
            sx + b * s.spread * 0.8, groundY - s.h * 0.9,
            sx + b * s.spread,       groundY - s.h * (0.6 + Math.abs(b)*0.15)
          );
          ctx.stroke();
        }
      }

      // ── Grass tufts (richer than before) ──
      const tufts = [
        0.04, 0.09, 0.14, 0.20, 0.25, 0.31, 0.36,
        0.41, 0.47, 0.53, 0.58, 0.64, 0.69, 0.75,
        0.80, 0.86, 0.90, 0.95,
      ];
      setInk(0.7, 0.28);
      for (const tfrac of tufts) {
        const gx = tfrac * W;
        const blades = 3 + (Math.round(tfrac * 97) % 3); // 3-5 blades, stable
        for (let b = 0; b < blades; b++) {
          const bx = gx + (b - blades/2 + 0.5) * 5;
          const bh = 8 + (Math.round(tfrac * 137 + b * 31) % 9);
          const lean = (b - blades/2) * 3.5;
          ctx.beginPath();
          ctx.moveTo(bx, groundY);
          ctx.quadraticCurveTo(bx + lean * 0.6, groundY - bh * 0.55, bx + lean, groundY - bh);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    // ══════════════════════════════════════════
    //  POSITIONS
    // ══════════════════════════════════════════
    let groundY, milkweedX, flowerX, chrysalisX, chrysalisY;
    const catStartX = -130;

    function initPositions() {
      groundY    = H * 0.82;
      milkweedX  = W * 0.72;
      flowerX    = W * 0.28;
      chrysalisX = milkweedX;
      chrysalisY = groundY - 240;
    }

    function flightPos(time) {
      const cx = W*0.45, cy = H*0.36, rx = W*0.26, ry = H*0.20;
      return {
        x: cx + Math.sin(time*0.38)*rx + Math.sin(time*0.19)*rx*0.3,
        y: cy + Math.sin(time*0.27)*ry + Math.cos(time*0.13)*ry*0.4,
      };
    }

    // ══════════════════════════════════════════
    //  STATE MACHINE
    // ══════════════════════════════════════════
    const S = {
      FLYING:"flying", RESTING:"resting", FLYING_AWAY:"flying_away",
      CAT_ENTER:"cat_enter", CRAWLING:"crawling",
      CLIMBING:"climbing", PAUSE_TOP:"pause_top", CHRYSALIS:"chrysalis",
      EMERGING:"emerging", TAKEOFF:"takeoff",
    };

    let state, t, stateDuration, phase;
    let walkPhase, wingBeat, restWingBeat;
    let bfx, bfy, bfxStart, bfyStart;
    let flyingBlendStart = null; // position butterfly was at when FLYING began
    let flyingBlendDur = 1.5;    // seconds to blend into flight path
    let catX, catY, crawlStartX;
    let leafHealth = 1;  // 1=full, 0=all eaten
    let leafGrowing = false; // true during chrysalis regrowth, false during climb

    function reset() {
      state = S.FLYING; t = 0; stateDuration = 0; phase = 0;
      leafHealth = 1;
      leafGrowing = false;
      walkPhase = 0; wingBeat = 0; restWingBeat = 0;
      const sp = flightPos(0);
      bfx = sp.x; bfy = sp.y; bfxStart = bfx; bfyStart = bfy;
      flyingBlendStart = null;
      catX = catStartX; catY = groundY-10; crawlStartX = catStartX;
    }

    function enterState(s) {
      state = s; phase = 0; stateDuration = 0;
      // Reset leaf state on entering CLIMBING so leaves always start fully visible
      if (s === S.CLIMBING) {
        leafHealth = 1;
        leafGrowing = false;
      }
      // Reset leafHealth to 0 when entering CHRYSALIS so regrowth always fades in gently
      if (s === S.CHRYSALIS) {
        leafHealth = 0;
        leafGrowing = false;
      }
    }

    let lastTime = null;

    function tick(ts) {
      if (!lastTime) lastTime = ts;
      const dt = Math.min((ts-lastTime)/1000, 0.05);
      lastTime = ts;

      t += dt; stateDuration += dt;
      walkPhase += dt*4; wingBeat += dt*6; restWingBeat += dt*1.2;

      ctx.clearRect(0,0,W,H);
      drawGround(groundY);
      drawMilkweed(milkweedX, groundY, leafHealth, state === S.CLIMBING ? Math.min(stateDuration * Math.min(260, Math.max(160, H*0.82*0.40)) * 0.078, Math.min(260, Math.max(160, H*0.82*0.40)) * 0.885) : 0);

      switch(state) {

        // ── 1. Butterfly drifts elegantly ──
        case S.FLYING: {
          // On first frame of FLYING, record where we entered from
          if (flyingBlendStart === null) {
            flyingBlendStart = { x: bfx, y: bfy };
          }
          const pos = flightPos(t);
          // Blend from entry position to flight path over flyingBlendDur seconds
          if (stateDuration < flyingBlendDur) {
            const p = stateDuration / flyingBlendDur;
            const ease = 1 - Math.pow(1 - p, 3);
            bfx = flyingBlendStart.x + (pos.x - flyingBlendStart.x) * ease;
            bfy = flyingBlendStart.y + (pos.y - flyingBlendStart.y) * ease;
          } else {
            bfx = pos.x; bfy = pos.y;
          }
          drawFlower(flowerX, groundY);
          drawButterfly(bfx, bfy, wingBeat);
          if (stateDuration > 9) {
            bfxStart = bfx; bfyStart = bfy;
            enterState(S.RESTING);
          }
          break;
        }

        // ── 2. Butterfly glides to flower and rests — stays until startled ──
        case S.RESTING: {
          const approachDur = 2.0;
          if (stateDuration <= approachDur) {
            const p = stateDuration/approachDur;
            const ease = 1-Math.pow(1-p,3);
            bfx = bfxStart+(flowerX-bfxStart)*ease;
            bfy = bfyStart+((groundY-72)-bfyStart)*ease;
            drawFlower(flowerX, groundY);
            drawButterfly(bfx, bfy, wingBeat*(1-p*0.85));
          } else {
            // Resting on flower — wings slowly fanning
            bfx = flowerX; bfy = groundY-72;
            drawFlower(flowerX, groundY);
            drawButterfly(bfx, bfy, restWingBeat);
          }
          // Caterpillar walks in while butterfly is resting
          if (stateDuration > approachDur + 1.5) {
            const catTargetX = flowerX - 20; // caterpillar walks close to flower
            catX = Math.min(catStartX + (stateDuration - (approachDur+1.5))*42, catTargetX);
            catY = groundY-10;
            drawCaterpillar(catX, catY, walkPhase);
            // Butterfly gets startled when caterpillar reaches the flower
            if (catX >= catTargetX) {
              bfxStart = bfx; bfyStart = bfy;
              enterState(S.FLYING_AWAY);
            }
          }
          break;
        }

        // ── 3. Butterfly startled — darts off-screen ──
        case S.FLYING_AWAY: {
          const dur = 2.8;
          phase = stateDuration / dur; // unbounded — we exit on position, not time
          const ease = phase < 0.5 ? 2*phase*phase : 1-Math.pow(-2*phase+2,2)/2;
          // Fly far enough right and up to guarantee clearing the canvas
          bfx = bfxStart + ease * (W - bfxStart + 120);
          bfy = bfyStart - ease * (bfyStart + 120);
          drawFlower(flowerX, groundY);
          catX = Math.min(catX + dt*42, milkweedX-30);
          catY = groundY-10;
          drawCaterpillar(catX, catY, walkPhase);
          // Only draw butterfly while it's still on-screen
          if (bfx < W + 60 && bfy > -60) {
            drawButterfly(bfx, bfy, wingBeat);
          }
          // Transition once it's fully off-screen
          if (bfx >= W + 60 || bfy <= -60) {
            crawlStartX = catX;
            enterState(S.CRAWLING);
          }
          break;
        }

        // ── 4. (unused) ──
        case S.CAT_ENTER: {
          enterState(S.CRAWLING);
          break;
        }

        // ── 4b. Caterpillar crawls the rest of the way to the milkweed base ──
        case S.CRAWLING: {
          const targetX = milkweedX - 30;
          catX = Math.min(crawlStartX + stateDuration*42, targetX);
          catY = groundY-10;
          drawFlower(flowerX, groundY);
          drawCaterpillar(catX, catY, walkPhase);
          if (catX >= targetX) enterState(S.CLIMBING);
          break;
        }

        // ── 5. Caterpillar climbs the milkweed ──
        case S.CLIMBING: {
          const stemH = Math.min(260, Math.max(160, H * 0.82 * 0.40));
          const climbDist = stemH * 0.885, speed = stemH * 0.078;
          const climbed = Math.min(stateDuration*speed, climbDist);
          leafHealth = Math.max(0, 1 - (climbed / climbDist));
          leafGrowing = false;

          // turnProgress 0→1 over the first 30% of climb — head leads, tail follows
          const turnProgress = Math.min(1, (climbed / climbDist) / 0.30);

          // Head tracks up the stem
          const headX = milkweedX - 6;
          const headY = groundY - climbed;

          drawFlower(flowerX, groundY);
          drawClimbingCaterpillar(headX, headY, walkPhase*0.7, turnProgress, climbed);
          if (climbed >= climbDist) enterState(S.PAUSE_TOP);
          break;
        }

        // ── 5b. Brief pause at the top before transforming ──
        case S.PAUSE_TOP: {
          const pauseDur = 1.8;
          drawFlower(flowerX, groundY);
          // Caterpillar rests at the top, still
          drawClimbingCaterpillar(milkweedX-6, groundY-(Math.min(260, Math.max(160, H*0.82*0.40)))*0.885, walkPhase*0.05, 1, (Math.min(260, Math.max(160, H*0.82*0.40)))*0.885);
          if (stateDuration >= pauseDur) enterState(S.CHRYSALIS);
          break;
        }

        // ── 6. Caterpillar transforms into chrysalis; leaves regrow during hold ──
        case S.CHRYSALIS: {
          const morphDur = 2.0, holdDur = 10.0, total = morphDur+holdDur;
          phase = Math.min(stateDuration/total, 1);
          const morphProgress = Math.min(stateDuration/morphDur, 1);
          const ease = 1-Math.pow(1-morphProgress, 2);
          const catAlpha = Math.max(0, 1-morphProgress*1.4);
          // Leaves regrow during the hold phase (after morphing is done)
          if (stateDuration > morphDur) {
            leafGrowing = true;
            leafHealth = Math.min(1, leafHealth + dt * 0.11);
          }
          drawFlower(flowerX, groundY);
          if (catAlpha > 0) {
            // Use same draw call & position as PAUSE_TOP so there's no jump
            drawClimbingCaterpillar(milkweedX-6, groundY-(Math.min(260, Math.max(160, H*0.82*0.40)))*0.885, walkPhase*0.02, 1, (Math.min(260, Math.max(160, H*0.82*0.40)))*0.885, catAlpha);
          }
          drawChrysalis(chrysalisX, chrysalisY, ease);
          if (phase >= 1) enterState(S.EMERGING);
          break;
        }

        // ── 7. Butterfly emerges from chrysalis ──
        case S.EMERGING: {
          const dur = 3.5;
          phase = Math.min(stateDuration/dur, 1);
          const ease = phase<0.5 ? 2*phase*phase : 1-Math.pow(-2*phase+2,2)/2;
          const chrysAlpha = Math.max(0, 1-phase*1.5);
          drawFlower(flowerX, groundY);
          drawChrysalis(chrysalisX, chrysalisY, 1, chrysAlpha);
          if (phase > 0.2) {
            const bAlpha = Math.min((phase-0.2)/0.5, 1);
            const bScale = 0.3+ease*0.7;
            drawButterfly(chrysalisX, chrysalisY+10, (phase-0.2)*10, bScale, bAlpha);
          }
          if (phase >= 1) {
            bfx = chrysalisX; bfy = chrysalisY+10;
            enterState(S.TAKEOFF);
          }
          break;
        }

        // ── 8. Butterfly takes off, loop restarts ──
        case S.TAKEOFF: {
          const dur = 2.5;
          phase = Math.min(stateDuration/dur, 1);
          const ease = 1-Math.pow(1-phase,3);
          bfy = (chrysalisY+10) - ease*H*0.22;
          bfx = chrysalisX + Math.sin(phase*Math.PI)*80;
          drawFlower(flowerX, groundY);
          drawButterfly(bfx, bfy, wingBeat);
          if (phase >= 1) {
            bfxStart = bfx; bfyStart = bfy;
            flyingBlendStart = null; // will be set on first frame of FLYING
            catX = catStartX; catY = groundY-10;
            enterState(S.FLYING);
          }
          break;
        }
      }

      requestAnimationFrame(tick);
    }

    initPositions();
    reset();
    requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
